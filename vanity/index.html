<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Go vanity-import metadata for k9o.dev/sdk-go (Option A).
  Deployed by CI to: k9o-packages/sdk-go/index.html (external MinIO),
  served at https://k9o.dev/sdk-go (+ subpaths) via edge Nginx.

  `go get k9o.dev/sdk-go` fetches https://k9o.dev/sdk-go?go-get=1 and reads
  the go-import tag below to locate the real source repo. go-source wires
  pkg.go.dev source links; the refresh sends human browsers to the docs
  (Go's ?go-get=1 reader ignores it). This is the ONLY required file.
-->
<meta name="go-import" content="k9o.dev/sdk-go git https://github.com/k9o-dev/sdk-go">
<meta name="go-source" content="k9o.dev/sdk-go https://github.com/k9o-dev/sdk-go https://github.com/k9o-dev/sdk-go/tree/main{/dir} https://github.com/k9o-dev/sdk-go/blob/main{/dir}/{file}#L{line}">
<meta http-equiv="refresh" content="0; url=https://pkg.go.dev/k9o.dev/sdk-go">
</head>
<body>Redirecting to <a href="https://pkg.go.dev/k9o.dev/sdk-go">pkg.go.dev/k9o.dev/sdk-go</a></body>
</html>
